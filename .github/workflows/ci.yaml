name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths-ignore:
      - "kustomize/**"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run Go Tests
        working-directory: app
        run: go test ./...

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        working-directory: app
        run: |
          docker build \
            -t $IMAGE_URI:${{ github.sha }} \
            -t $IMAGE_URI:latest \
            .

      - name: Push Docker Images
        run: |
          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest

      - name: Install Kustomize
        run: |
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Verify Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d

      - name: Update Kustomize Image
        working-directory: kustomize/overlays/dev
        run: |
          kustomize edit set image \
            $IMAGE_URI=$IMAGE_URI:${{ github.sha }}

      - name: Commit Updated Manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add kustomize/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "Deploy image ${{ github.sha }}"

      - name: Push Manifest Changes
        run: git push