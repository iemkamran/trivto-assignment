apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-api

  template:
    metadata:
      labels:
        app: hello-api

    spec:

      serviceAccountName: hello-api

      containers:

      - name: hello-api

        image: yourdockerhub/hello-api:v1

        imagePullPolicy: Always

        ports:

        - containerPort: 8080

        envFrom:

        - configMapRef:
            name: hello-api-config

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi