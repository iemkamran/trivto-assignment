apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivto
spec:
  project: default
  source:
    repoURL: https://github.com/example/trivto-assignment.git
    targetRevision: HEAD
    path: kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}
