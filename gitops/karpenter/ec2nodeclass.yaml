apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023

  instanceProfile: hello-api-dev-karpenter-instance-profile

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: hello-dev

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: hello-dev

  amiSelectorTerms:
    - alias: al2023@latest

  tags:
    Name: hello-dev-karpenter-node
    karpenter.sh/discovery: hello-dev

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true